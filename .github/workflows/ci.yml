name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep PR cycles snappy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # --- light, parallel gates (Node 22 + 24 matrix) ---------------------------

  typecheck:
    name: typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  typecheck-strict:
    # Phase 0: info-only. The strict ratchet wrapper filters tsc output to
    # `src/app/lib/` and reports a count; the lib has roughly 155 pre-existing
    # strict errors today. Phase 1 drives the count to zero (or seeds a
    # baseline). Flip continue-on-error to false once the count is zero or
    # a baseline-verifier replaces the raw script.
    name: typecheck:strict (info, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:strict

  lint:
    # Phase 0: `eslint` and `prettier --check` are info-only because legacy
    # code has roughly 573 lint errors and significant prettier drift. The
    # any + rxjs-x baseline verifier is the actual ratchet, and the
    # god-component LOC gate via dependency-cruiser is enforcing. Flip
    # continue-on-error to false on each step as Phase 1+ phases drive
    # legacy counts to zero per file.
    name: lint (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: eslint (info)
        continue-on-error: true
        run: pnpm lint
      - name: prettier check (info)
        continue-on-error: true
        run: pnpm format:check
      - name: lint baseline verifier (any + rxjs-x monotonic decrease)
        run: pnpm lint:baseline
      - name: dependency-cruiser + god-component gate
        run: pnpm cruise

  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: upload coverage
        if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # --- build, then downstream gates (Node 24 only) ---------------------------

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e (chromium)
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public/
      - run: pnpm test:e2e --project=chromium
      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  size-limit:
    # Phase 0: warn-only per roadmap section 5. continue-on-error keeps the
    # workflow green while the action still posts a PR comment with deltas.
    # Flip continue-on-error to false once budgets ratchet (Phase 4+, 6).
    name: size-limit
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public/
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: build
          package_manager: pnpm
          script: pnpm size-limit --json

  lighthouse:
    # Phase 0: info-only per roadmap section 5 + section 3 Phase 7. Upgrades
    # to gating once Phase 7 a11y burndown completes.
    name: lighthouse (info)
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public/
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
