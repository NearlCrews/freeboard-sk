<div class="resourcelist">
  <fb-card style="border-radius: unset">
    <fb-card-header>
      <span fbCardTitle>
        <div class="title-block">
          <div style="width: 50px">
            <fb-button
              variant="ghost"
              size="sm"
              ariaLabel="Close waypoint list"
              (pressed)="close()"
              matTooltip="Close Waypoint List"
              matTooltipPosition="right"
            >
              <fb-icon name="arrow_back" ariaLabel=""></fb-icon>
            </fb-button>
          </div>
          <div style="flex: 1 1 auto; padding-top: 7px">Waypoints</div>
        </div>
      </span>
    </fb-card-header>
    <fb-card-content>
      <div style="display: flex">
        <div style="flex: 1 1 auto; padding-left: 3px">
          <fb-search-input
            label="Filter waypoints"
            [value]="filterText"
            (valueChange)="filterKeyUp($event)"
            [widthPx]="180"
          />
        </div>
        <div>
          <fb-button
            variant="ghost"
            size="sm"
            ariaLabel="Reload waypoints"
            [disabled]="disableRefresh"
            (pressed)="initItems()"
            matTooltip="Reload Waypoints"
            matTooltipPosition="below"
          >
            <fb-icon name="refresh" ariaLabel=""></fb-icon>
          </fb-button>
        </div>
        <div>
          <fb-checkbox
            [disabled]="fullList.length === 0 || disableRefresh"
            [checked]="allSel"
            [indeterminate]="someSel"
            (checkedChange)="toggleAll($event)"
            [matTooltip]="(!allSel || someSel) ? 'Select All' : 'Deselect All'"
            matTooltipPosition="below"
          >
          </fb-checkbox>
        </div>
      </div>
    </fb-card-content>
  </fb-card>

  <div class="resources">
    @if(this.app.sIsFetching()) {
    <fb-progress-bar indeterminate></fb-progress-bar>
    }
    <cdk-virtual-scroll-viewport class="vscroller" itemSize="90">
      <fb-card
        *cdkVirtualFor="let r of filteredList(); let i= index;"
        style="border-bottom: silver 1px outset; border-radius: unset"
      >
        <fb-card-content>
          <div style="display: flex; padding-left: 5px">
            <div style="flex: 1 1 auto; width: 215px">
              <div
                style="
                  text-overflow: ellipsis;
                  overflow-x: hidden;
                  white-space: pre;
                "
              >
                <mat-icon [ngClass]="{'icon-warn': r[1].type=='pseudoAtoN'}">
                  room
                </mat-icon>
                <b>{{(r[1].name) ? r[1].name : 'Wpt-' + r[0].slice(-6)}}</b>
              </div>
            </div>
            <div style="text-align: right">
              <fb-checkbox
                [disabled]="r[0] === activeWaypoint() || disableRefresh"
                [checked]="r[2]"
                (checkedChange)="itemSelect($event, r[0])"
                matTooltip="Show on Map"
                matTooltipPosition="left"
              >
              </fb-checkbox>
            </div>
          </div>
        </fb-card-content>
        <fb-card-actions align="start">
          <div style="display: flex">
            <div>
              <fb-button
                variant="ghost"
                size="sm"
                ariaLabel="Delete waypoint"
                [disabled]="r[0] === activeWaypoint() || disableRefresh"
                (pressed)="itemDelete(r[0])"
                matTooltip="Delete Waypoint"
                matTooltipPosition="above"
              >
                <fb-icon name="delete" ariaLabel=""></fb-icon>
              </fb-button>
            </div>
            <fb-button
              variant="ghost"
              size="sm"
              ariaLabel="Waypoint notes"
              (pressed)="itemViewNotes(r)"
              matTooltip="Waypoint notes"
              matTooltipPosition="above"
            >
              <fb-icon name="local_offer" ariaLabel=""></fb-icon>
            </fb-button>
            <div style="flex: 1 1 auto; text-align: center">
              @if(!activeWaypoint() || activeWaypoint() !== r[0]) {
              <fb-button
                variant="ghost"
                size="sm"
                ariaLabel="Navigate to waypoint"
                [disabled]="disableRefresh"
                (pressed)="itemGoTo(r[0])"
                matTooltip="Navigate to Waypoint"
                matTooltipPosition="above"
              >
                <fb-icon name="near_me" ariaLabel=""></fb-icon>
              </fb-button>
              } @if(activeWaypoint() === r[0]) {
              <fb-button
                variant="ghost"
                size="sm"
                ariaLabel="Clear destination"
                [disabled]="disableRefresh"
                (pressed)="itemClearActive()"
                matTooltip="Clear Destination"
                matTooltipPosition="above"
              >
                <fb-icon name="clear_all" ariaLabel=""></fb-icon>
              </fb-button>
              }
            </div>
            <div>
              <fb-button
                variant="ghost"
                size="sm"
                ariaLabel="Center waypoint"
                [disabled]="app.uiConfig().mapMove || !r[2]"
                (pressed)="emitCenter(r[1].feature.geometry.coordinates)"
                matTooltip="Center Waypoint"
                matTooltipPosition="above"
              >
                <fb-icon name="center_focus_strong" ariaLabel=""></fb-icon>
              </fb-button>
              @if(app.featureFlags().resourceGroups) {
              <fb-button
                variant="ghost"
                size="sm"
                ariaLabel="Add to group"
                [disabled]="disableRefresh"
                (pressed)="itemAddToGroup(r[0])"
                matTooltip="Add to Group"
                matTooltipPosition="above"
              >
                <fb-icon name="category" ariaLabel=""></fb-icon>
              </fb-button>
              }
            </div>
            <div>
              <fb-button
                variant="ghost"
                size="sm"
                ariaLabel="Waypoint properties"
                [disabled]="disableRefresh"
                (pressed)="itemProperties(r[0])"
                matTooltip="Waypoint Properties"
                matTooltipPosition="above"
              >
                <fb-icon name="info" ariaLabel=""></fb-icon>
              </fb-button>
            </div>
          </div>
        </fb-card-actions>
      </fb-card>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
