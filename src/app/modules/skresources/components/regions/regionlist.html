<div class="resourcelist">
  <fb-card style="border-radius: unset">
    <fb-card-header>
      <span fbCardTitle>
        <div class="title-block">
          <div style="width: 50px">
            <fb-button
              variant="ghost"
              (pressed)="close()"
              matTooltip="Close Region List"
              matTooltipPosition="right"
              ariaLabel="Close Region List"
            >
              <fb-icon name="arrow_back" ariaLabel=""></fb-icon>
            </fb-button>
          </div>
          <div style="flex: 1 1 auto; padding-top: 7px">Regions</div>
        </div>
      </span>
    </fb-card-header>
    <fb-card-content>
      <div style="display: flex">
        <div style="flex: 1 1 auto; padding-left: 3px">
          <fb-search-input
            label="Filter regions"
            [value]="filterText"
            (valueChange)="filterKeyUp($event)"
            [widthPx]="170"
          />
        </div>
        <div>
          <fb-button
            variant="ghost"
            (pressed)="initItems()"
            matTooltip="Reload Regions"
            matTooltipPosition="below"
            ariaLabel="Reload Regions"
          >
            <fb-icon name="refresh" ariaLabel=""></fb-icon>
          </fb-button>
        </div>
        <div>
          <mat-checkbox
            #selall
            [disabled]="fullList.length === 0"
            [checked]="allSel"
            [indeterminate]="someSel"
            (change)="toggleAll($event.checked)"
            [matTooltip]="(!selall.checked || someSel) ? 'Select All' : 'Deselect All'"
            matTooltipPosition="below"
          >
          </mat-checkbox>
        </div>
      </div>
    </fb-card-content>
  </fb-card>

  <div class="resources">
    <cdk-virtual-scroll-viewport class="vscroller" itemSize="72">
      <fb-card
        *cdkVirtualFor="let r of filteredList(); let i= index;"
        style="border-bottom: silver 1px outset; border-radius: unset"
      >
        <fb-card-content>
          <div style="display: flex">
            <div style="flex: 1 1 auto; width: 215px">
              <div
                style="
                  text-overflow: ellipsis;
                  overflow-x: hidden;
                  white-space: pre;
                "
              >
                <b>{{r[1].name}}</b>
              </div>
              <remark
                style="
                  flex: 1 1 auto;
                  text-align: left;
                  font-style: italic;
                  overflow: hidden;
                  display: -webkit-box;
                  -webkit-box-orient: vertical;
                  -webkit-line-clamp: 2;
                  line-clamp: 2;
                  text-overflow: ellipsis;
                "
                [markdown]="r[1].description ?? ''"
              >
                <ng-template remarkTemplate="heading" let-node>
                  <h1 [remarkNode]="node" style="font-size: 10pt"></h1>
                </ng-template>
              </remark>
            </div>
            <div style="text-align: right">
              <mat-checkbox
                [checked]="r[2]"
                (change)="itemSelect($event.checked, r[0])"
                matTooltip="Show in Map"
                matTooltipPosition="left"
              >
              </mat-checkbox>
            </div>
          </div>
        </fb-card-content>
        <fb-card-actions align="start">
          <div style="display: flex">
            <div style="flex: 1 1 auto; text-align: right">
              <fb-button
                variant="ghost"
                [disabled]="app.uiConfig().mapMove"
                (pressed)="emitCenter(r[1])"
                matTooltip="Center Region"
                matTooltipPosition="above"
                ariaLabel="Center Region"
              >
                <fb-icon name="center_focus_strong" ariaLabel=""></fb-icon>
              </fb-button>

              <fb-button
                variant="ghost"
                (pressed)="itemProperties(r[0])"
                matTooltip="Region Properties"
                matTooltipPosition="above"
                ariaLabel="Region Properties"
              >
                <fb-icon name="info" ariaLabel=""></fb-icon>
              </fb-button>

              @if(app.featureFlags().resourceGroups) { &nbsp;
              <fb-button
                variant="ghost"
                (pressed)="itemAddToGroup(r[0])"
                matTooltip="Add to Group"
                matTooltipPosition="above"
                ariaLabel="Add to Group"
              >
                <fb-icon name="category" ariaLabel=""></fb-icon>
              </fb-button>
              }
            </div>
          </div>
        </fb-card-actions>
      </fb-card>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
