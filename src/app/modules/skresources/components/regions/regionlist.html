<div class="resourcelist">
  <fb-card style="border-radius: unset">
    <fb-card-header>
      <span fbCardTitle>
        <div class="title-block">
          <div class="w-50">
            <fb-button
              variant="ghost"
              (pressed)="close()"
              fbTooltip="Close Region List"
              fbTooltipPosition="right"
              ariaLabel="Close Region List"
            >
              <fb-icon name="arrow_back" ariaLabel=""></fb-icon>
            </fb-button>
          </div>
          <div class="flex-auto pt-sm">Regions</div>
        </div>
      </span>
    </fb-card-header>
    <fb-card-content>
      <div class="flex">
        <div class="flex-auto pl-xs">
          <fb-search-input
            label="Filter regions"
            [value]="filterText"
            (valueChange)="filterKeyUp($event)"
            [widthPx]="170"
          />
        </div>
        <div>
          <fb-button
            variant="ghost"
            (pressed)="initItems()"
            fbTooltip="Reload Regions"
            fbTooltipPosition="below"
            ariaLabel="Reload Regions"
          >
            <fb-icon name="refresh" ariaLabel=""></fb-icon>
          </fb-button>
        </div>
        <div>
          <fb-checkbox
            #selall
            [disabled]="fullList.length === 0"
            [checked]="allSel"
            [indeterminate]="someSel"
            (checkedChange)="toggleAll($event)"
            [fbTooltip]="(!selall.checked() || someSel) ? 'Select All' : 'Deselect All'"
            fbTooltipPosition="below"
          >
          </fb-checkbox>
        </div>
      </div>
    </fb-card-content>
  </fb-card>

  <div class="resources">
    <cdk-virtual-scroll-viewport class="vscroller" itemSize="72">
      <fb-card
        *cdkVirtualFor="let r of filteredList(); let i= index;"
        class="list-divider"
      >
        <fb-card-content>
          <div class="flex">
            <div class="list-name-col">
              <div
                style="
                  text-overflow: ellipsis;
                  overflow-x: hidden;
                  white-space: pre;
                "
              >
                <b>{{r[1].name}}</b>
              </div>
              <remark
                style="
                  flex: 1 1 auto;
                  text-align: left;
                  font-style: italic;
                  overflow: hidden;
                  display: -webkit-box;
                  -webkit-box-orient: vertical;
                  -webkit-line-clamp: 2;
                  line-clamp: 2;
                  text-overflow: ellipsis;
                "
                [markdown]="r[1].description ?? ''"
              >
                <ng-template remarkTemplate="heading" let-node>
                  <h1
                    [remarkNode]="node"
                    style="font-size: var(--font-size-sm)"
                  ></h1>
                </ng-template>
              </remark>
            </div>
            <div class="text-right">
              <fb-checkbox
                [checked]="r[2]"
                (checkedChange)="itemSelect($event, r[0])"
                fbTooltip="Show in Map"
                fbTooltipPosition="left"
              >
              </fb-checkbox>
            </div>
          </div>
        </fb-card-content>
        <fb-card-actions align="start">
          <div class="flex">
            <div style="flex: 1 1 auto; text-align: right">
              <fb-button
                variant="ghost"
                [disabled]="app.uiConfig().mapMove"
                (pressed)="emitCenter(r[1])"
                fbTooltip="Center Region"
                fbTooltipPosition="above"
                ariaLabel="Center Region"
              >
                <fb-icon name="center_focus_strong" ariaLabel=""></fb-icon>
              </fb-button>

              <fb-button
                variant="ghost"
                (pressed)="itemProperties(r[0])"
                fbTooltip="Region Properties"
                fbTooltipPosition="above"
                ariaLabel="Region Properties"
              >
                <fb-icon name="info" ariaLabel=""></fb-icon>
              </fb-button>

              @if(app.featureFlags().resourceGroups) { &nbsp;
              <fb-button
                variant="ghost"
                (pressed)="itemAddToGroup(r[0])"
                fbTooltip="Add to Group"
                fbTooltipPosition="above"
                ariaLabel="Add to Group"
              >
                <fb-icon name="category" ariaLabel=""></fb-icon>
              </fb-button>
              }
            </div>
          </div>
        </fb-card-actions>
      </fb-card>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
