<div class="resourcelist">
  <fb-card style="border-radius: unset">
    <fb-card-header>
      <span fbCardTitle>
        <div class="title-block">
          <div style="width: 50px">
            <button
              mat-icon-button
              (click)="close()"
              matTooltip="Close Track List"
              matTooltipPosition="above"
            >
              <fb-icon name="arrow_back" ariaLabel=""></fb-icon>
            </button>
          </div>
          <div style="flex: 1 1 auto; padding-top: 7px">Tracks</div>
        </div>
      </span>
    </fb-card-header>
    <fb-card-content>
      <div style="display: flex">
        <div style="flex: 1 1 auto; padding-left: 3px">
          <fb-search-input
            label="Filter tracks"
            [value]="filterText"
            (valueChange)="filterKeyUp($event)"
            [widthPx]="180"
          />
        </div>
        <div>
          <button
            mat-icon-button
            (click)="initItems()"
            matTooltip="Reload Tracks"
            matTooltipPosition="below"
          >
            <fb-icon name="refresh" ariaLabel=""></fb-icon>
          </button>
        </div>
        <div>
          <mat-checkbox
            #selall
            [disabled]="fullList.length === 0"
            [checked]="allSel"
            [indeterminate]="someSel"
            (change)="toggleAll($event.checked)"
            [matTooltip]="(!selall.checked || someSel) ? 'Select All' : 'Deselect All'"
            matTooltipPosition="below"
          >
          </mat-checkbox>
        </div>
      </div>
    </fb-card-content>
  </fb-card>

  <div class="resources">
    @if(this.app.sIsFetching()) {
    <fb-progress-bar indeterminate></fb-progress-bar>
    }
    <cdk-virtual-scroll-viewport class="vscroller" itemSize="120">
      <fb-card
        *cdkVirtualFor="let r of filteredList(); let i= index;"
        style="border-bottom: silver 1px outset; border-radius: unset"
      >
        <fb-card-content>
          <div style="display: flex; padding-left: 5px">
            <div style="flex: 1 1 auto; width: 215px">
              <div
                style="
                  padding-top: 11px;
                  text-overflow: ellipsis;
                  overflow-x: hidden;
                  white-space: pre;
                "
              >
                <b>{{r[1].feature.properties?.name || i}}</b>
              </div>
              <remark
                style="
                  flex: 1 1 auto;
                  text-align: left;
                  font-style: italic;
                  overflow: hidden;
                  display: -webkit-box;
                  -webkit-box-orient: vertical;
                  -webkit-line-clamp: 2;
                  line-clamp: 2;
                  text-overflow: ellipsis;
                "
                [markdown]="r[1].description ?? ''"
              >
                <ng-template remarkTemplate="heading" let-node>
                  <h1 [remarkNode]="node" style="font-size: 10pt"></h1>
                </ng-template>
              </remark>
            </div>
            <div style="text-align: right">
              <mat-checkbox
                [checked]="r[2]"
                (change)="itemSelect($event.checked, r[0])"
                matTooltip="Show on Map"
                matTooltipPosition="left"
              >
              </mat-checkbox>
            </div>
          </div>
        </fb-card-content>
        <fb-card-actions align="start">
          <div style="display: flex">
            <div style="flex: 1 1 auto">
              <button
                mat-icon-button
                (click)="itemDelete(r[0])"
                matTooltip="Delete Track"
                matTooltipPosition="above"
              >
                <fb-icon name="delete" ariaLabel=""></fb-icon>
              </button>
            </div>
            <div>
              <button
                mat-icon-button
                (click)="itemProperties(r[0])"
                matTooltip="Track Properties"
                matTooltipPosition="above"
              >
                <fb-icon name="edit" ariaLabel=""></fb-icon>
              </button>
            </div>
            <div>
              <button
                mat-icon-button
                [disabled]="app.uiConfig().mapMove"
                (click)="emitCenter(r[1].feature.geometry.coordinates[0][0])"
                matTooltip="Center Track"
                matTooltipPosition="above"
              >
                <fb-icon name="center_focus_strong" ariaLabel=""></fb-icon>
              </button>
            </div>
          </div>
        </fb-card-actions>
      </fb-card>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
