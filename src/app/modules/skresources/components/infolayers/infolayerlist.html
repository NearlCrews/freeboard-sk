<div class="resourcelist">
  <fb-card style="border-radius: unset">
    <fb-card-header>
      <span fbCardTitle>
        <div class="title-block">
          <div style="width: 50px">
            <fb-button
              variant="ghost"
              (pressed)="close()"
              matTooltip="Close InfoLayer List"
              matTooltipPosition="right"
              ariaLabel="Close InfoLayer List"
            >
              <fb-icon name="arrow_back" ariaLabel=""></fb-icon>
            </fb-button>
          </div>
          <div style="flex: 1 1 auto; padding-top: 7px">Overlays</div>
        </div>
      </span>
    </fb-card-header>
    <fb-card-content>
      <div style="display: flex">
        <div style="flex: 1 1 auto; padding-left: 3px">
          <fb-search-input
            label="Filter info layers"
            [value]="filterText"
            (valueChange)="filterKeyUp($event)"
            [widthPx]="180"
          />
        </div>
        <div>
          <fb-button
            variant="ghost"
            (pressed)="initItems()"
            matTooltip="Reload Layers"
            matTooltipPosition="below"
            ariaLabel="Reload Layers"
          >
            <fb-icon name="refresh" ariaLabel=""></fb-icon>
          </fb-button>
        </div>
        <div>
          <fb-checkbox
            #selall
            [checked]="allSel"
            [indeterminate]="someSel"
            (checkedChange)="toggleAll($event)"
            [matTooltip]="(!selall.checked() || someSel) ? 'Select All' : 'Deselect All'"
            matTooltipPosition="below"
          >
          </fb-checkbox>
        </div>
      </div>
    </fb-card-content>
    <fb-card-actions align="start">
      <fb-button
        variant="ghost"
        matTooltip="Add Layer"
        matTooltipPosition="above"
        ariaLabel="Add Layer"
        (pressed)="openAddLayerMenu($event)"
      >
        <fb-icon name="add" ariaLabel=""></fb-icon>
      </fb-button>
      <small
        >Map layers containing dynamic information to overlay on charts.</small
      >
    </fb-card-actions>
  </fb-card>

  <div class="resources infolayers">
    @if(this.app.sIsFetching()) {
    <fb-progress-bar indeterminate></fb-progress-bar>
    } @else {
    <cdk-virtual-scroll-viewport class="vscroller" itemSize="48">
      <fb-card
        *cdkVirtualFor="let r of filteredList(); let i= index;"
        style="border-bottom: silver 1px outset; border-radius: unset"
      >
        <fb-card-content>
          <div style="display: flex">
            <div
              style="
                flex: 1 1 auto;
                text-align: left;
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                width: 245px;
              "
            >
              <b>{{(r[1].name)}}</b>
            </div>
            <div style="text-align: right">
              <fb-checkbox
                [checked]="r[2]"
                (checkedChange)="itemSelect($event, r[0])"
                matTooltip="Show layer"
                matTooltipPosition="left"
              >
              </fb-checkbox>
            </div>
          </div>
        </fb-card-content>
        <fb-card-actions align="start">
          <div style="flex: auto">
            <div style="display: flex">
              <div style="flex: 1 1 auto; display: flex; gap: 8px">
                <fb-form-field
                  #refreshField
                  label="Auto Refresh"
                  [widthPx]="120"
                >
                  <fb-select
                    [name]="refreshField.controlId"
                    [options]="refreshSelectOptions"
                    [value]="r[1].values.refreshInterval"
                    (valueChange)="setRefresh(r[0], $event!)"
                    ariaLabel="Set refresh interval"
                    matTooltip="Set refresh interval"
                    matTooltipPosition="above"
                  ></fb-select>
                </fb-form-field>
                <fb-form-field #opacityField label="Opacity" [widthPx]="105">
                  <fb-select
                    [name]="opacityField.controlId"
                    [options]="opacitySelectOptions"
                    [value]="r[1].values.opacity"
                    (valueChange)="setOpacity(r[0], $event!)"
                    ariaLabel="Set layer opacity"
                    matTooltip="Set layer opacity"
                    matTooltipPosition="above"
                  ></fb-select>
                </fb-form-field>
              </div>
            </div>
            @if(r[1].values.time?.values && r[1].values.time?.values.length > 1
            && r[2]) {
            <div style="display: flex">
              <fb-slider
                style="flex: 2"
                [disabled]="!r[2]"
                [min]="0"
                [max]="r[1].values.time?.values.length-1"
                matTooltip="Set opacity"
                matTooltipPosition="below"
                (valueChange)="handleSliderChange(r,$event); timeLabel.innerText = formatDateTime(r[1].values.time, $event)"
              ></fb-slider>
            </div>
            <div style="display: flex" #timeLabel></div>
            }
            <!--@if(r[1].values.time?.interval && r[2]) {
            <div style="display: flex">
              <fb-slider
                style="flex: 2"
                [disabled]="!r[2]"
                [min]="0"
                [max]="maxIndexFrominterval(r[1].values?.time)"
                (valueChange)="handleSliderChange(r,$event); timeLabel.innerText = formatDateTime(r[1].values.time, $event)"
              ></fb-slider>
            </div>
            <div style="display: flex" #timeLabel></div>
          }-->
            <div style="display: flex">
              <div style="flex: 2">
                <fb-button
                  variant="ghost"
                  (pressed)="itemDelete(r[0])"
                  matTooltip="Delete Layer"
                  matTooltipPosition="above"
                  ariaLabel="Delete Layer"
                >
                  <fb-icon
                    name="delete"
                    ariaLabel=""
                    class="icon-warn"
                  ></fb-icon>
                </fb-button>
              </div>
              <div style="flex: 2; text-align: right; padding-right: 10px">
                <fb-button
                  variant="ghost"
                  (pressed)="itemProperties(r[0])"
                  matTooltip="Layer Properties"
                  matTooltipPosition="above"
                  ariaLabel="Layer Properties"
                >
                  <fb-icon name="info" ariaLabel=""></fb-icon>
                </fb-button>
              </div>
            </div>
          </div>
        </fb-card-actions>
      </fb-card>
    </cdk-virtual-scroll-viewport>
    }
  </div>
</div>
