<div class="resourcelist">
  <fb-card style="border-radius: unset">
    <fb-card-header>
      <span fbCardTitle>
        <div class="title-block">
          <div style="width: 50px">
            <fb-button
              variant="ghost"
              (pressed)="close()"
              matTooltip="Close Route List"
              matTooltipPosition="right"
              ariaLabel="Close Route List"
            >
              <fb-icon name="arrow_back" ariaLabel=""></fb-icon>
            </fb-button>
          </div>
          <div style="flex: 1 1 auto; padding-top: 7px">Routes</div>
        </div>
      </span>
    </fb-card-header>
    <fb-card-content>
      <div style="display: flex">
        <div style="flex: 1 1 auto; padding-left: 3px">
          <fb-search-input
            label="Filter routes"
            [value]="filterText"
            (valueChange)="filterKeyUp($event)"
            [widthPx]="180"
          />
        </div>
        <div>
          <fb-button
            variant="ghost"
            [disabled]="disableRefresh"
            (pressed)="initItems()"
            matTooltip="Reload Routes"
            matTooltipPosition="below"
            ariaLabel="Reload Routes"
          >
            <fb-icon name="refresh" ariaLabel=""></fb-icon>
          </fb-button>
        </div>
        <div>
          <fb-checkbox
            #selall
            [disabled]="fullList.length === 0 || disableRefresh"
            [checked]="allSel"
            [indeterminate]="someSel"
            (checkedChange)="toggleAll($event)"
            [matTooltip]="(!selall.checked() || someSel) ? 'Select All' : 'Deselect All'"
            matTooltipPosition="below"
          >
          </fb-checkbox>
        </div>
      </div>
    </fb-card-content>
  </fb-card>

  <div class="resources">
    @if(this.app.sIsFetching()) {
    <fb-progress-bar indeterminate></fb-progress-bar>
    }
    <cdk-virtual-scroll-viewport class="vscroller" itemSize="120">
      <fb-card
        *cdkVirtualFor="let r of filteredList(); let i= index;"
        style="border-bottom: silver 1px outset; border-radius: unset"
      >
        <fb-card-content>
          <div style="display: flex; padding-left: 5px">
            <div style="flex: 1 1 auto; width: 215px">
              <div
                style="
                  padding-top: 11px;
                  text-overflow: ellipsis;
                  overflow-x: hidden;
                  white-space: pre;
                "
              >
                <b>{{r[1].name}}</b>
              </div>
              <remark
                style="
                  flex: 1 1 auto;
                  text-align: left;
                  font-style: italic;
                  overflow: hidden;
                  display: -webkit-box;
                  -webkit-box-orient: vertical;
                  -webkit-line-clamp: 2;
                  line-clamp: 2;
                  text-overflow: ellipsis;
                "
                [markdown]="r[1].description ?? ''"
              >
                <ng-template remarkTemplate="heading" let-node>
                  <h1 [remarkNode]="node" style="font-size: 10pt"></h1>
                </ng-template>
              </remark>
              <div>
                <i>{{formatDistance(r[1].distance)}} </i>
              </div>
            </div>
            <div style="text-align: right">
              <fb-checkbox
                [checked]="r[2]"
                [disabled]="r[0] === activeRoute() || disableRefresh"
                (checkedChange)="itemSelect($event, r[0])"
                matTooltip="Show on Map"
                matTooltipPosition="left"
              >
              </fb-checkbox>
            </div>
          </div>
        </fb-card-content>
        <fb-card-actions align="start">
          <div style="display: flex">
            <div style="flex: 1 1 auto">
              <fb-button
                variant="ghost"
                (pressed)="itemDelete(r[0])"
                [disabled]="r[0] === activeRoute() || disableRefresh"
                matTooltip="Delete Route"
                matTooltipPosition="above"
                ariaLabel="Delete Route"
              >
                <fb-icon name="delete" ariaLabel=""></fb-icon>
              </fb-button>
              <fb-button
                variant="ghost"
                (pressed)="itemViewNotes(r)"
                matTooltip="Route notes"
                matTooltipPosition="above"
                ariaLabel="Route notes"
              >
                <fb-icon name="local_offer" ariaLabel=""></fb-icon>
              </fb-button>
              <fb-button
                variant="ghost"
                [disabled]="disableRefresh"
                (pressed)="itemViewPoints(r[0])"
                matTooltip="Route points"
                matTooltipPosition="above"
                ariaLabel="Route points"
              >
                <fb-icon name="flag" ariaLabel=""></fb-icon>
              </fb-button>
              @if(r[0] !== activeRoute()) {
              <fb-button
                variant="ghost"
                [disabled]="disableRefresh"
                (pressed)="itemSetActive(r[0])"
                matTooltip="Start"
                matTooltipPosition="above"
                ariaLabel="Start"
              >
                <fb-icon name="near_me" ariaLabel=""></fb-icon>
              </fb-button>
              } @else {
              <fb-button
                variant="ghost"
                [disabled]="disableRefresh"
                (pressed)="itemClearActive(r[0])"
                matTooltip="Clear Active Route"
                matTooltipPosition="above"
                ariaLabel="Clear Active Route"
              >
                <fb-icon name="clear_all" ariaLabel=""></fb-icon>
              </fb-button>
              }
            </div>
            <div>
              <fb-button
                variant="ghost"
                [disabled]="disableRefresh"
                (pressed)="itemProperties(r[0])"
                matTooltip="Edit Route Properties"
                matTooltipPosition="above"
                ariaLabel="Edit Route Properties"
              >
                <fb-icon name="edit" ariaLabel=""></fb-icon>
              </fb-button>
            </div>
            @if(app.featureFlags().resourceGroups) { &nbsp;
            <div>
              <fb-button
                variant="ghost"
                [disabled]="disableRefresh"
                (pressed)="itemAddToGroup(r[0])"
                matTooltip="Add to Group"
                matTooltipPosition="above"
                ariaLabel="Add to Group"
              >
                <fb-icon name="category" ariaLabel=""></fb-icon>
              </fb-button>
            </div>
            }
          </div>
        </fb-card-actions>
      </fb-card>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
