<div class="fb-rich-editor">
  <div class="fb-rich-editor__toolbar" role="toolbar" aria-label="Formatting">
    <fb-button
      variant="ghost"
      size="sm"
      ariaLabel="Undo"
      fbTooltip="Undo"
      (pressed)="editor.chain().focus().undo().run()"
    >
      <fb-icon name="undo" ariaLabel=""></fb-icon>
    </fb-button>
    <fb-button
      variant="ghost"
      size="sm"
      ariaLabel="Redo"
      fbTooltip="Redo"
      (pressed)="editor.chain().focus().redo().run()"
    >
      <fb-icon name="redo" ariaLabel=""></fb-icon>
    </fb-button>
    <fb-divider orientation="vertical"></fb-divider>
    <fb-button
      variant="ghost"
      size="sm"
      ariaLabel="Bold"
      fbTooltip="Bold"
      (pressed)="editor.chain().focus().toggleBold().run()"
    >
      <fb-icon name="format_bold" ariaLabel=""></fb-icon>
    </fb-button>
    <fb-button
      variant="ghost"
      size="sm"
      ariaLabel="Italic"
      fbTooltip="Italic"
      (pressed)="editor.chain().focus().toggleItalic().run()"
    >
      <fb-icon name="format_italic" ariaLabel=""></fb-icon>
    </fb-button>
    <fb-button
      variant="ghost"
      size="sm"
      ariaLabel="Underline"
      fbTooltip="Underline"
      (pressed)="editor.chain().focus().toggleUnderline().run()"
    >
      <fb-icon name="format_underlined" ariaLabel=""></fb-icon>
    </fb-button>
    <fb-button
      variant="ghost"
      size="sm"
      ariaLabel="Text color"
      fbTooltip="Text color"
      (pressed)="toggleColorPicker()"
    >
      <fb-icon name="format_color_text" ariaLabel=""></fb-icon>
    </fb-button>
    <fb-divider orientation="vertical"></fb-divider>
    <fb-button
      variant="ghost"
      size="sm"
      ariaLabel="Link"
      fbTooltip="Link"
      (pressed)="openLinkEditor()"
    >
      <fb-icon name="link" ariaLabel=""></fb-icon>
    </fb-button>
  </div>
  @if (colorPickerOpen()) {
    <div class="fb-rich-editor__swatches" role="group" aria-label="Text color">
      @for (swatch of palette(); track swatch.label) {
        <button
          type="button"
          class="fb-rich-editor__swatch"
          [class.fb-rich-editor__swatch--clear]="swatch.value === null"
          [style.background]="swatch.value ?? 'transparent'"
          [attr.aria-label]="swatch.label"
          [fbTooltip]="swatch.label"
          (click)="applyColor(swatch.value)"
        ></button>
      }
    </div>
  }
  @if (linkEditorOpen()) {
    <div
      class="fb-rich-editor__link-edit"
      role="group"
      aria-label="Edit link URL"
    >
      <fb-input
        name="fb-rich-editor-link-url"
        type="text"
        placeholder="https://example.com"
        ariaLabel="Link URL"
        [(value)]="linkUrl"
        (keydown.enter)="applyLink()"
        (keydown.escape)="cancelLinkEditor()"
      ></fb-input>
      <fb-button variant="primary" size="sm" (pressed)="applyLink()"
        >Apply</fb-button
      >
      @if (linkActive()) {
        <fb-button variant="ghost" size="sm" (pressed)="removeLink()"
          >Remove</fb-button
        >
      }
      <fb-button
        variant="ghost"
        size="sm"
        ariaLabel="Cancel"
        (pressed)="cancelLinkEditor()"
      >
        <fb-icon name="close" ariaLabel=""></fb-icon>
      </fb-button>
    </div>
  }
  <tiptap-editor [editor]="editor"></tiptap-editor>
</div>
