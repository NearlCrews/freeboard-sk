<div class="_ap-trail2route">
  <fb-toolbar style="background-color: transparent">
    <span fbToolbarLeading
      ><fb-icon name="insights" ariaLabel=""></fb-icon
    ></span>
    <h2 fbToolbarTitle style="margin: 0; font-size: inherit; font-weight: 500">
      Vessel Trail to Route
    </h2>
    <span fbToolbarActions>
      <button
        mat-icon-button
        aria-label="Cancel trail conversion"
        (click)="doClose(false);"
      >
        <fb-icon name="close" ariaLabel=""></fb-icon>
      </button>
    </span>
  </fb-toolbar>

  <mat-dialog-content style="width: 50vw">
    <div style="display: block">
      <div>
        <mat-slider
          min="0.000001"
          max="0.1005"
          step="0.000001"
          value="tolerance"
          matTooltip="Set tolerance"
        >
          <input matSliderThumb (valueChange)="changeTolerance($event.value)" />
        </mat-slider>
        &nbsp;Points: {{pointCount}}
      </div>
      <div>
        <mat-checkbox
          [checked]="incServer"
          (change)="getServerTrail($event.checked)"
        >
          Include Trail from server
        </mat-checkbox>
      </div>
    </div>
    <div style="display: flex; border: black 1px solid; height: 40vh">
      <div style="width: 100%; height: 100%">
        <ol-map
          [logo]="false"
          [olInteractions]="[
                      {name: 'dragpan'},
                      {name: 'dragzoom'},
                      {name: 'keyboardpan'},
                      {name: 'keyboardzoom'},
                      {name: 'mousewheelzoom'},
                      {name: 'pinchzoom'}
                  ]"
          [olControls]="mapControls"
          olView
          [zoom]="10"
          [center]="mapCenter"
          [rotation]="0"
          [minZoom]="2"
          [enableAnimation]="false"
        >
          <fb-routes [routes]="rteFromTrail"> </fb-routes>
        </ol-map>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <div style="text-align: center; width: 100%">
      <button
        mat-raised-button
        [disabled]="pointCount==0"
        (click)="doClose(true)"
      >
        SAVE
      </button>
    </div>
  </mat-dialog-actions>
</div>
