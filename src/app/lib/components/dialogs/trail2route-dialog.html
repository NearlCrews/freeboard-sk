<div class="_ap-trail2route">
  <fb-toolbar style="background-color: transparent">
    <span fbToolbarLeading
      ><fb-icon name="insights" ariaLabel=""></fb-icon
    ></span>
    <h2 fbToolbarTitle style="margin: 0; font-size: inherit; font-weight: 500">
      Vessel Trail to Route
    </h2>
    <span fbToolbarActions>
      <fb-button
        variant="ghost"
        ariaLabel="Cancel trail conversion"
        (pressed)="doClose(false);"
      >
        <fb-icon name="close" ariaLabel=""></fb-icon>
      </fb-button>
    </span>
  </fb-toolbar>

  <mat-dialog-content style="width: 50vw">
    <div style="display: block">
      <div>
        <fb-slider
          [min]="0.000001"
          [max]="0.1005"
          [step]="0.000001"
          [value]="tolerance"
          matTooltip="Set tolerance"
          (valueChange)="changeTolerance($event)"
        ></fb-slider>
        &nbsp;Points: {{pointCount}}
      </div>
      <div>
        <fb-checkbox
          [checked]="incServer"
          (checkedChange)="getServerTrail($event)"
        >
          Include Trail from server
        </fb-checkbox>
      </div>
    </div>
    <div
      style="display: flex; border: var(--color-text) 1px solid; height: 40vh"
    >
      <div style="width: 100%; height: 100%">
        <ol-map
          [logo]="false"
          [olInteractions]="[
                      {name: 'dragpan'},
                      {name: 'dragzoom'},
                      {name: 'keyboardpan'},
                      {name: 'keyboardzoom'},
                      {name: 'mousewheelzoom'},
                      {name: 'pinchzoom'}
                  ]"
          [olControls]="mapControls"
          olView
          [zoom]="10"
          [center]="mapCenter"
          [rotation]="0"
          [minZoom]="2"
          [enableAnimation]="false"
        >
          <fb-routes [routes]="rteFromTrail"> </fb-routes>
        </ol-map>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <div style="text-align: center; width: 100%">
      <fb-button
        variant="primary"
        [disabled]="pointCount==0"
        (pressed)="doClose(true)"
      >
        SAVE
      </fb-button>
    </div>
  </mat-dialog-actions>
</div>
