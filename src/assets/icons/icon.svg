<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Binnacle app icon.

  Family identity (shared across @NearlCrews Signal K apps and plugins):
  rounded square with a deep-ocean gradient and three stacked stylized
  wave lines. Per-project differentiation: a bottom-right circle badge
  in a project-specific colour with a small glyph. The badge is the
  only region that varies between sibling projects.

  This variant's badge: brass-gold (#D4A017) with a compass rose. The
  binnacle is the housing for the ship's compass at the helm: the
  literal piece of furniture this digital chart plotter replaces.
  Brass evokes the traditional binnacle's metalwork, and the compass
  rose inside is the visible north-pointing face mariners actually
  read. Brass-gold is distinct from sibling yellow (weather), orange
  (NMEA2000 emitter), green (predecessor chat), and violet (OpenRouter
  companion) badges, keeping the family visually separable at
  thumbnail size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Open Binnacle app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E4D6B"/>
      <stop offset="1" stop-color="#1A8DAB"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background, deep-ocean gradient. Corners outside
       the rounded path stay transparent so the host UI (SignalK admin
       app-dock tile, iOS home screen) sees the icon shape, not a
       square bleed to the tile edges. -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Family motif: three stacked wave lines centered in the canvas -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.94">
    <path d="M 80,176 q 44,-36 88,0 t 88,0 t 88,0 t 88,0"/>
    <path d="M 80,256 q 44,-36 88,0 t 88,0 t 88,0 t 88,0"/>
    <path d="M 80,336 q 44,-36 88,0 t 88,0 t 88,0 t 88,0"/>
  </g>

  <!-- Project badge: bottom-right circle (brass-gold for the binnacle housing) -->
  <circle cx="388" cy="388" r="84" fill="#D4A017" stroke="#FFFFFF" stroke-width="8"/>

  <!--
    Badge glyph: compass rose centered at (388,388). Eight cardinal and
    inter-cardinal points laid out as paired triangles (filled north-half
    and stroked south-half pattern). The cardinal arms (N E S W) are
    longer than the inter-cardinals (NE SE SW NW). Center pivot dot for
    the compass card axis. All in dark teal #1B3A4B for contrast against
    the gold badge.

    Geometry: outer radius 48 for cardinals, 30 for inter-cardinals,
    inner radius 8 (arm width at the pivot).
  -->
  <g fill="#1B3A4B" stroke="none">
    <!-- North arm -->
    <polygon points="388,340 380,388 396,388"/>
    <!-- East arm -->
    <polygon points="436,388 388,380 388,396"/>
    <!-- South arm -->
    <polygon points="388,436 380,388 396,388"/>
    <!-- West arm -->
    <polygon points="340,388 388,380 388,396"/>
  </g>
  <g fill="#1B3A4B" fill-opacity="0.7" stroke="none">
    <!-- Inter-cardinal arms (NE, SE, SW, NW). Shorter pointed shapes
         offset 45 degrees from the cardinals. -->
    <polygon points="421.2,354.8 384.5,391.5 391.5,391.5"/>
    <polygon points="421.2,421.2 384.5,384.5 384.5,391.5"/>
    <polygon points="354.8,421.2 391.5,384.5 391.5,391.5"/>
    <polygon points="354.8,354.8 391.5,391.5 384.5,391.5"/>
  </g>
  <!-- Outer ring (compass card edge) -->
  <circle cx="388" cy="388" r="50" fill="none" stroke="#1B3A4B" stroke-width="3"/>
  <!-- Center pivot -->
  <circle cx="388" cy="388" r="5" fill="#1B3A4B"/>
  <!-- North marker dot above the N arm (orienting cue) -->
  <circle cx="388" cy="332" r="4" fill="#1B3A4B"/>
</svg>
